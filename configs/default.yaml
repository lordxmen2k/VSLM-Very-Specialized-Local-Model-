# VSLM — configuration.
#
# Every value here is also a command line flag; this file exists so that a
# run can be described in one place and reproduced.

model:
  # The base model.
  #
  # This is the instruction-tuned checkpoint, not the Base release. Qwen
  # ships one tuned release for Qwen3-1.7B and calls it Qwen/Qwen3-1.7B;
  # there is no separate "-Instruct" name for it. It carries a ChatML chat
  # template and its weights are trained to end a turn with <|im_end|>.
  #
  # The first fine-tune used Qwen3-1.7B-Base, trained on raw text with no
  # template, and was scored with the benchmark's system prompt prepended as
  # plain text. Two things followed: the model was answering a prompt format
  # it had never seen, and it had never been taught to stop, so every
  # generation ran to the token cap. The first benchmark batch did not
  # finish in six minutes.
  base: Qwen/Qwen3-1.7B
  # The card this was tuned for.
  gpu: RTX 4070 12 GB
  dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  quantisation: nf4
  double_quantisation: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 2
  lr: 1.0e-4
  warmup_ratio: 0.03
  # The sequence cap, and it is the trainer's cap: la.train reads this
  # value, so the file is the single source of truth. It was hard-coded at
  # 1536 in the trainer while this file said 2048, which made the file
  # inert and cut 15.5 per cent of the corpus - and the end of a
  # completion is where the answer and the plot spec are.
  #
  # 2560, measured with the model's own tokenizer over 800 sampled
  # examples: the longest is 2,456 tokens (a 5x5 determinant, whose
  # elimination shows every row operation and whose VERIFY shows every
  # minor) and none is over 2,500.
  #
  # The memory cost is the logits: about 1.5 MB per token over a
  # vocabulary of 151,936, so this cap needs about 7.5 GB of live tensors,
  # against the 12.88 GB the card has.
  max_seq_len: 2560
  batch_size: 1
  grad_accum: 16
  optimiser: paged_adamw_8bit
  grad_clip: 1.0
  # Rough cost on one RTX 4070: about 0.7 s per optimiser step for a 1.7B
  # model at a 2048 token sequence with 16 gradient accumulation steps.
  # 20 000 examples is roughly 1 250 steps, so about 15 minutes per epoch.
  expected_steps_per_epoch: 1250

data:
  n_train: 20000
  n_test: 200
  seed: 7
  workers: 4
  # Generation is about 9 problems a second on one core and scales roughly
  # linearly with workers.
  generation_rate_per_second_per_core: 9
  # Run 6 gives the nine benchmark families 70 per cent of the examples.
  # The ten benchmark corpus families share 7000 points, 700 each. The nine
  # background families share the remaining 3000 points, 333.33 each; the
  # fraction below is rounded to 333 so the declared total stays integral.
  family_weights:
    # benchmark families: 10 of 19, 70 per cent of the corpus
    determinant: 700
    eigenvalue: 700
    eigenvalue_numeric: 700
    rank: 700
    nullity: 700
    matrix_trace: 700
    matrix_transpose: 700
    matrix_multiply: 700
    matrix_power: 700
    matrix_vector: 700
    # background families: 9 of 19, 30 per cent of the corpus
    solve_system: 333
    diagonalize: 333
    orthonormal_basis: 333
    projection: 333
    least_squares: 333
    lu_factor: 333
    svd: 333
    condition_number: 333
    linear_transform: 334

benchmark:
  # LinAlg-Bench: SymPy-verified linear algebra problems across 3x3, 4x4 and
  # 5x5 matrices and nine operation types, with ten frontier models scored on
  # it. NeurIPS 2026 Datasets and Benchmarks track, CC-BY-4.0.
  #   https://github.com/linalgbench2026/LinAlgBench
  #   https://huggingface.co/datasets/mst-ai/linalg-bench-llm
  name: LinAlg-Bench
  sizes: [3x3, 4x4, 5x5]
  operations: [determinant, eigenvalue, rank, nullity, trace, transpose,
               multiplication, matrix_power, matrix_vector]
  # The finding that shapes the corpus: accuracy falls 32 points between 4x4
  # and 5x5 on determinants, and the models that fail there fabricate rather
  # than compute. The corpus therefore trains 5x5, teaches elimination rather
  # than cofactor expansion above 3x3, and ends every derivation with a check.
  cliff_4x4_to_5x5_det_points: 32
  published_accuracy:
    OpenAI-o1: [94.6, 92.3, 81.4]
    Gemini-3.1-Pro: [93.7, 94.6, 88.0]
    DeepSeek-V3: [89.3, 79.9, 62.5]
    GPT-5.2: [85.8, 82.1, 69.2]
    Mistral-Large: [81.4, 75.6, 45.1]
    Qwen3-235B: [79.8, 80.5, 71.5]
    Claude-4.5-Sonnet: [80.1, 69.7, 33.1]
    Qwen2.5-72B: [69.4, 39.8, 24.6]
    Llama-3.3-70B: [63.1, 60.6, 28.3]
    GPT-4o: [66.6, 36.0, 28.7]

evaluation:
  temperature: 0.0
  max_new_tokens: 768
  batch_size: 8
  # The four numbers that matter: the graded mathematics, the figure kind, the
  # figure values, and how often the model says it cannot do the problem.
  report:
    - answer_accuracy
    - plot_kind_accuracy
    - plot_value_accuracy
    - abstention_rate
