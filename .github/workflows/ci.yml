name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run the tests
        run: python -m unittest discover -s tests

      - name: Check the corpus arithmetic
        run: python -m la.check_arithmetic --n 20

      - name: Build a small corpus and render a figure
        run: python -m la.build_dataset --n-train 40 --n-test 8 --seed 7 --out data/ci --render-first 2
